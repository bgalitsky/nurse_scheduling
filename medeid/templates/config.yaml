# Настройки обезличивания для ОДНОЙ больницы. Лежит в папке настроек
# (Windows: C:\ProgramData\medeid\settings, иначе ~/medeid_settings или MEDEID_SETTINGS).
# КОНФИДЕНЦИАЛЬНО (прил. 1, п. 2, пп. 2): доступ — только отдел ИБ. Не храните в репозитории программы.
#
# Блоки «типы_документов», «категории_и_режимы», «сквозной_код_пациента», «сдвиг_дат» —
# это ПРАВИЛА изменения данных. Их утверждает локальный акт (прил. 1, п. 2, пп. 3 и 6):
#   1) python -m medeid rules -o deid_rules.docx   — выгрузить текст правил для приказа;
#   2) после подписания приказа впишите в «утверждение» его номер, дату и редакцию из выгрузки.
# Если правила изменят после утверждения, обработка будет запрещена до нового утверждения.

# Основание по умолчанию для партии (оператор уточняет в окне программы).
запустил: ivanov.ii                # в окне и CLI заменяется учётной записью ОС
основание:
  приказ_номер: "___"
  приказ_дата: "___"
  цель: контроль качества
  отделение: "___"

# ------------------------------------------------------------- ПРАВИЛА (утверждаются приказом)
типы_документов: [выписной_эпикриз, протокол_консилиума, осмотр_врача]   # + результаты_обследования

категории_и_режимы:
  фио_пациента:        замена_меткой      # замена_меткой | удаление | сквозной_код
  фио_родственников:   замена_меткой      # замена_меткой | удаление
  фио_врачей:          специальность      # специальность → [ВРАЧ-КАРДИОЛОГ] | замена_меткой | удаление
  фио_прочие:          замена_меткой      # ФИО, роль которых не определена
  адрес:               обобщение_до_города   # | замена_меткой | удаление
  телефон:             удаление           # удаление | замена_меткой
  email:               удаление
  снилс_полис_паспорт: удаление
  номер_истории:       удаление
  номера_документов:   замена_меткой      # № консилиумов, гистологии, ИГХ и т. п. → [num] | удаление
  место_работы:        замена_меткой      # | удаление
  даты:                только_год         # оставить | только_год | квартал | сдвиг | замена_меткой | удаление
  возраст:             как_есть           # как_есть | возрастная_группа (40–49)
  возраст_старше_89:   "90+"

сквозной_код_пациента: нет   # если "да": фио_пациента: сквозной_код, ключ создаётся в хранилище_ключей

сдвиг_дат:                   # используется при даты: сдвиг
  диапазон_дней: [-365, 365]
  после_обработки: удалить   # удалить | хранить_в_ключе

# Утверждение правил (заполняется после подписания приказа):
# утверждение:
#   редакция: R-XXXXXXXXXX     # из выгрузки правил
#   приказ_номер: "___"
#   приказ_дата: "___"

# ------------------------------------------------------------- хранилища (пути задаёт ИБ)
хранилище_ключей: ~/medeid_secure/keys.sqlite      # ПДн: таблица «код ↔ пациент»
журнал: ~/medeid_journal/journal.sqlite            # без ПДн

# ------------------------------------------------------------- способ поиска
#   модель+правила — локальная языковая модель + правила (рекомендуется);
#   модель         — только модель (даты и возраст всё равно разбираются правилами);
#   правила        — без модели.
# В окне программы оператор может выключить модель для партии.
извлечение: модель+правила

модель:                          # см. INSTALL_LLM.md
  движок: ollama                 # ollama | openai (llama.cpp server, vLLM, LM Studio)
  сервер: http://127.0.0.1:11434 # только localhost или внутренняя сеть
  имя: qwen3:8b
  дайджест: ""                   # обязателен; узнать: python -m medeid check-model
  # файл_модели: /models/model.gguf   # для движка openai: по нему считается дайджест
  инструкция: llm_prompt.yaml    # файл в папке настроек (конфиденциально)
  seed: 42
  контекст: 8192
  размер_фрагмента: 2500
  таймаут_сек: 600
  кэш: ~/medeid_secure/llm_cache.sqlite   # ответы модели содержат ПДн — рядом с ключами
  разрешить_внешний_сервер: нет

версия_инструмента: 2.2.0
версия_словарей: 2026-11-11         # каталог dicts/2026-11-11 в папке настроек
